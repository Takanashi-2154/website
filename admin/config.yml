backend:
  name: git-gateway
  branch: main
  identity_url: https://vermillion-crisp-6ce1ae.netlify.app/.netlify/identity
  gateway_url: https://vermillion-crisp-6ce1ae.netlify.app/.netlify/git

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Blog"
    folder: "posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }
